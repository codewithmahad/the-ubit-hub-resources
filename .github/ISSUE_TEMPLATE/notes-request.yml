name: Request notes
description: Ask for notes or practice material for a course or topic.
title: "[Notes request] "
body:
  - type: markdown
    attributes:
      value: Check the course list, its guide if available, and existing requests first. If a topic is missing, tell us what would help. Another student may have notes they can share.
  - type: input
    id: course
    attributes:
      label: Course and code
      placeholder: Data Structures and Algorithms, code if known
    validations:
      required: true
  - type: input
    id: teacher
    attributes:
      label: Teacher, if relevant
      description: Use Sir or Miss where appropriate and retain Prof. or Dr. Leave this blank for general practice material or if you are unsure.
    validations:
      required: false
  - type: input
    id: context
    attributes:
      label: Program, term, and programming language
      description: Include what helps match the notes. Do not include your roll number.
      placeholder: SE, semester 3, Fall 2026, C++
  - type: textarea
    id: coverage
    attributes:
      label: Which notes would help?
      description: Name the topics, type of notes, and any existing set you checked.
    validations:
      required: true
