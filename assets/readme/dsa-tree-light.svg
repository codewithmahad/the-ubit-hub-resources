<svg xmlns="http://www.w3.org/2000/svg" width="176" height="144" viewBox="0 0 176 144" role="img" aria-labelledby="title desc">
  <title id="title">The DSA Blueprint: a binary search tree</title>
  <desc id="desc">A search for 6 follows the highlighted path from 8 to 4 to 6. Other nodes are 2, 12, 10, and 14.</desc>
  <g fill="none" stroke="#B9A6A7" stroke-width="2" stroke-linecap="round">
    <path d="M88 24 48 68 20 118M48 68l28 50M88 24l40 44-20 50M128 68l28 50"/>
    <path d="M88 24 48 68l28 50" stroke="#8F141B" stroke-width="3"/>
  </g>
  <g stroke="#B9A6A7" stroke-width="1.7" fill="#FBF7EF">
    <circle cx="20" cy="118" r="14"/><circle cx="128" cy="68" r="14"/><circle cx="108" cy="118" r="14"/><circle cx="156" cy="118" r="14"/>
  </g>
  <circle cx="48" cy="68" r="14" fill="#F9E8E9" stroke="#8F141B" stroke-width="2"/>
  <g fill="#8F141B"><circle cx="88" cy="24" r="16"/><circle cx="76" cy="118" r="15"/></g>
  <g font-family="ui-monospace,monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#342629">
    <text x="20" y="118">2</text><text x="128" y="68">12</text><text x="108" y="118">10</text><text x="156" y="118">14</text><text x="48" y="68" fill="#8F141B">4</text>
    <text x="88" y="24" fill="#FFFFFF">8</text><text x="76" y="118" fill="#FFFFFF">6</text>
  </g>
</svg>
