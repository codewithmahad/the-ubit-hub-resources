<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
  <title id="title">Archive card catalogue</title>
  <desc id="desc">An illustrated catalogue card marked notes, guides, and chapters.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9f3e7"/><stop offset="1" stop-color="#e9dfca"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="155%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4a3526" flood-opacity=".22"/></filter>
  </defs>
  <g filter="url(#shadow)" transform="translate(42 24) rotate(3 190 120)">
    <rect width="376" height="230" rx="8" fill="url(#paper)" stroke="#b9a98d" stroke-width="2"/>
    <path d="M28 52H348M28 84H348M28 116H348M28 148H348M28 180H348" stroke="#c4b898" stroke-width="1"/>
    <path d="M112 22V208" stroke="#c4b898" stroke-width="1"/>
    <text x="28" y="35" fill="#19323c" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">ARCHIVE CARD</text>
    <text x="28" y="73" fill="#9b5a49" font-family="Georgia, serif" font-size="17" font-weight="700">Notes</text>
    <text x="132" y="73" fill="#4e6459" font-family="Arial, sans-serif" font-size="14">the first proper pass</text>
    <text x="28" y="105" fill="#9b5a49" font-family="Georgia, serif" font-size="17" font-weight="700">Guides</text>
    <text x="132" y="105" fill="#4e6459" font-family="Arial, sans-serif" font-size="14">where to focus next</text>
    <text x="28" y="137" fill="#9b5a49" font-family="Georgia, serif" font-size="17" font-weight="700">Chapters</text>
    <text x="132" y="137" fill="#4e6459" font-family="Arial, sans-serif" font-size="14">depth when you need it</text>
    <text x="28" y="169" fill="#9b5a49" font-family="Georgia, serif" font-size="17" font-weight="700">Context</text>
    <text x="132" y="169" fill="#4e6459" font-family="Arial, sans-serif" font-size="14">so nothing is a mystery file</text>
    <path d="M282 194c23-20 46-20 69 0" fill="none" stroke="#d67d62" stroke-width="2" stroke-linecap="round"/>
    <circle cx="316" cy="193" r="3" fill="#d67d62"/>
  </g>
</svg>
