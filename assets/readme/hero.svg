<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">The UBIT Hub Resources</title>
  <desc id="desc">A warm academic archive banner with organised notes, cards, and a bookmark.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f0e3"/><stop offset="1" stop-color="#e8ddc9"/></linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132a35"/><stop offset="1" stop-color="#0b1924"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#061018" flood-opacity=".42"/></filter>
    <pattern id="grain" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M1 3h1M10 8h1M5 12h1" stroke="#fff" stroke-opacity=".12" stroke-width=".7"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#desk)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grain)" opacity=".28"/>
  <path d="M0 249C136 224 198 278 352 257c135-19 226-4 349 3 215 12 326-42 499-16v56H0Z" fill="#091721" opacity=".72"/>
  <g transform="translate(64 57)">
    <text x="0" y="20" fill="#c8d7ce" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3">UNIVERSITY OF KARACHI · UBIT</text>
    <text x="0" y="92" fill="#f8f1e4" font-family="Georgia, serif" font-size="58" font-weight="700">THE UBIT HUB</text>
    <text x="3" y="125" fill="#e68a6e" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">RESOURCES</text>
    <path d="M3 145H456" stroke="#d87960" stroke-width="2" stroke-linecap="round" opacity=".86"/>
    <text x="3" y="180" fill="#c8d7ce" font-family="Arial, sans-serif" font-size="16">A shelf for notes worth keeping.</text>
  </g>
  <g filter="url(#shadow)" transform="translate(770 30) rotate(-3 168 110)">
    <rect x="12" y="28" width="260" height="178" rx="5" fill="#c96e54"/>
    <rect x="24" y="18" width="260" height="178" rx="5" fill="#7f9b86"/>
    <rect x="37" y="8" width="260" height="178" rx="5" fill="url(#paper)"/>
    <path d="M49 38H218M49 52H266M49 66H238" stroke="#788b81" stroke-width="2" stroke-linecap="round" opacity=".62"/>
    <path d="M49 91H274M49 105H250M49 119H269M49 133H198" stroke="#1d3a44" stroke-width="1.7" stroke-linecap="round" opacity=".45"/>
    <rect x="49" y="151" width="95" height="17" rx="8.5" fill="#183542"/>
    <text x="61" y="163.5" fill="#f8f1e4" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.3">STUDY NOTES</text>
    <path d="M252 8h27v86l-13.5-11-13.5 11Z" fill="#d87960"/>
  </g>
  <g transform="translate(1032 93)">
    <circle cx="47" cy="47" r="46" fill="#d9cda9" opacity=".12"/>
    <circle cx="47" cy="47" r="31" fill="none" stroke="#d9cda9" stroke-width="1.5" opacity=".66"/>
    <path d="M31 45h32M47 29v32" stroke="#d9cda9" stroke-width="2" stroke-linecap="round"/>
    <text x="47" y="112" text-anchor="middle" fill="#c8d7ce" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2">KEEP · SHARE</text>
  </g>
</svg>
